name: .NET WPF CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore NuGet packages
      run: dotnet restore CybersecurityChatbotPart2/CybersecurityChatbotPart2.csproj
    - name: Build
      run: dotnet build CybersecurityChatbotPart2/CybersecurityChatbotPart2.csproj --no-restore --configuration Release
